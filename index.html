<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Tugas Pertemuan 6 - JS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Manajemen Data Pelanggan</h2>

      <!-- Form tambah data -->
      <form id="formTambah" class="form-card">
        <label for="nama">Nama</label>
        <input type="text" id="nama" required placeholder="Masukkan Nama" />

        <label for="umur">Umur</label>
        <input type="number" id="umur" required placeholder="Masukkan Umur" />

        <label for="alamat">Alamat</label>
        <input type="text" id="alamat" required placeholder="Masukkan Alamat" />

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Masukkan Email" />

        <button type="submit" class="btn primary">Tambah Data</button>
      </form>

      <!-- Tabel data -->
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Umur</th>
            <th>Alamat</th>
            <th>Email</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="dataList"></tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
